name: Check

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        env:
            HUSKY: '0'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '26.8.2'
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: '1.4.2'
            - run: bun install --frozen-lockfile
            - run: bun run util:check
